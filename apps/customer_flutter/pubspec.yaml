name: swiftcab_customer
description: "SwiftCab - Customer App. Book rides anywhere in India."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  http: ^1.4.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2

  # Google Maps
  google_maps_flutter: ^2.10.0
  google_maps_flutter_android: ^2.14.17
  google_maps_flutter_ios: ^2.4.18

  # Location
  geolocator: ^14.0.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  google_maps_flutter_web: ^0.6.4+1
  pointer_interceptor: ^0.10.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
