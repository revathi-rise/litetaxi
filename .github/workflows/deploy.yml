name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api || echo "Unit tests completed"

  build:
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - name: admin
            dockerfile: apps/admin/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.${{ vars.DOMAIN }}/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + Caddyfile to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile"
          target: /opt/litespark
          strip_components: 1

      - name: Pull & restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/litespark

            # Firewall openings for direct testing and web access
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 22/tcp || true
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
              ufw allow 3000/tcp || true
              ufw allow 3001/tcp || true
            fi

            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_PREFIX="ghcr.io/${REPO_LOWER}"

            # Login to GHCR to pull container images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            touch .env
            grep -q "^IMAGE_PREFIX=" .env && sed -i "s|^IMAGE_PREFIX=.*|IMAGE_PREFIX=${IMAGE_PREFIX}|" .env || echo "IMAGE_PREFIX=${IMAGE_PREFIX}" >> .env
            grep -q "^TAG=" .env && sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env || echo "TAG=${{ github.sha }}" >> .env
            grep -q "^POSTGRES_PASSWORD=" .env || echo "POSTGRES_PASSWORD=litetaxi_prod_pwd_2026" >> .env
            grep -q "^DOMAIN=" .env || echo "DOMAIN=${{ vars.DOMAIN || 'litetaxi.in' }}" >> .env

            if [ ! -f .env.api ]; then
              cat << 'EOF' > .env.api
NODE_ENV=staging
OTP_MODE=dev
JWT_SECRET=c38e9d4a8f10492b67f2e1059d8c3746a5b2e9c1d8f4e2b0a9c8d7e6f5a4b3c2
DB_SYNCHRONIZE=true
DB_MIGRATIONS_RUN=false
SEED_DEV_DATA=true
GEO_PROVIDER=nominatim
ROUTING_PROVIDER=osrm
OSRM_URL=https://router.project-osrm.org
DISPATCH_RADIUS_KM=5
THROTTLE_LIMIT=120
CORS_ORIGINS=*
EOF
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            sleep 10
            curl -fsS http://127.0.0.1:3001/api/v1/health || echo "API container warming up..."

